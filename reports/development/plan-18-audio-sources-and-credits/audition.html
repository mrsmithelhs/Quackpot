<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quackpot sound audition</title>
<style>
:root{--bg:#f6f4ee;--panel:#fff;--ink:#1d2430;--muted:#5b6575;--line:#d9d4c7;--accent:#0b6b5e;--accent-ink:#fff;--warn:#8a4b00;--warnbg:#fff1d6;--bad:#9b1c1c;--badbg:#fde8e8;--chip:#ece8dc;--focus:#1a56db}
@media (prefers-color-scheme:dark){:root{--bg:#14181f;--panel:#1d232d;--ink:#e8ebf0;--muted:#a3adbd;--line:#333c4a;--accent:#47c2b0;--accent-ink:#06201b;--warn:#ffcf8a;--warnbg:#3a2c12;--bad:#ffb4b4;--badbg:#3a1a1a;--chip:#2a313d;--focus:#8ab4ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
header.top{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px}
header.top h1{font-size:1.05rem;margin:0 0 6px}
.bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.bar label{display:flex;align-items:center;gap:6px}
#status{margin:6px 0 0;min-height:1.4em;color:var(--muted)}
#status.err{color:var(--bad)}
main{max-width:1100px;margin:0 auto;padding:12px 16px 60px}
button,select,input[type=text],textarea{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;min-height:36px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.danger{border-color:var(--bad);color:var(--bad)}
button[aria-pressed=true]{background:var(--chip);border-color:var(--accent);font-weight:600}
button:disabled{opacity:.5;cursor:not-allowed}
nav.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
nav.tabs button[aria-selected=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.notice{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:10px 12px;margin:10px 0}
.notice.warn{background:var(--warnbg);color:var(--warn);border-color:var(--warn)}
.role{margin:18px 0}
.role>h2{margin:0 0 2px;font-size:1.15rem}
.role .blurb{color:var(--muted);margin:0 0 8px}
.poolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0 10px}
.poolbar .grow{flex:1 1 200px;color:var(--muted)}
h3.sub{margin:12px 0 6px;font-size:.95rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px}
.card.rejected{opacity:.55}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.card.playing{outline:2px solid var(--accent)}
.card .title{font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:4px 6px;font-size:.85rem;color:var(--muted)}
.chip{background:var(--chip);border-radius:999px;padding:1px 8px;font-size:.78rem;color:var(--ink)}
.chip.lic{border:1px solid var(--accent)}
.chip.warn{background:var(--warnbg);color:var(--warn)}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cardstatus{min-height:1.2em;font-size:.85rem;color:var(--muted)}
.cardstatus.err{color:var(--bad)}
details.more{font-size:.85rem}
details.more summary{cursor:pointer;color:var(--muted)}
details.more dl{margin:6px 0;display:grid;grid-template-columns:max-content 1fr;gap:2px 10px}
details.more dt{color:var(--muted)}
details.more dd{margin:0;word-break:break-word}
textarea.note{width:100%;min-height:2.2em;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 6px}
.sr{position:absolute;left:-9999px}
.mock{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;margin:8px 0}
table{border-collapse:collapse;width:100%}
td,th{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}
@media (max-width:560px){.grid{grid-template-columns:1fr}header.top{padding:8px 12px}main{padding:10px 12px 60px}}
</style>
</head>
<body>
<header class="top">
  <h1>Quackpot sound audition <span class="chip">report-only · catalog <span id="rev"></span></span></h1>
  <div class="bar">
    <button id="stopAll" class="primary" type="button">Stop all</button>
    <label>Master volume <input id="vol" type="range" min="0" max="100" value="60" aria-describedby="volOut"> <output id="volOut">60%</output></label>
    <label><input id="mute" type="checkbox"> Mute</label>
    <span class="chip" id="voiceCount" aria-live="off">0 playing</span>
  </div>
  <p id="status" role="status" aria-live="polite"></p>
</header>
<main>
  <nav class="tabs" role="tablist" aria-label="Sections">
    <button role="tab" id="t-effects" aria-selected="true" aria-controls="p-effects">Effects by purpose</button>
    <button role="tab" id="t-mocks" aria-selected="false" aria-controls="p-mocks">Audition mocks</button>
    <button role="tab" id="t-music" aria-selected="false" aria-controls="p-music">Music</button>
    <button role="tab" id="t-choices" aria-selected="false" aria-controls="p-choices">My choices</button>
    <button role="tab" id="t-credits" aria-selected="false" aria-controls="p-credits">Credits &amp; notices</button>
  </nav>
  <div class="notice warn" id="banner"></div>
  <section id="p-effects" role="tabpanel" aria-labelledby="t-effects"></section>
  <section id="p-mocks" role="tabpanel" aria-labelledby="t-mocks" hidden></section>
  <section id="p-music" role="tabpanel" aria-labelledby="t-music" hidden></section>
  <section id="p-choices" role="tabpanel" aria-labelledby="t-choices" hidden></section>
  <section id="p-credits" role="tabpanel" aria-labelledby="t-credits" hidden></section>
</main>
<noscript><p class="notice">This page needs JavaScript. Audio files are local; nothing is fetched from the network.</p></noscript>
<script src="catalog/catalog-data.js"></script>
<script>
(function () {
'use strict';
var CAT = window.QP18_CATALOG;
var $ = function (id) { return document.getElementById(id); };

window.addEventListener('pagehide', function () { stopAll(); });

// ---------- random preview from selected pool ----------
var lastPlayed = {};
function pickFrom(g, setName) {
  var ids = poolOf(g).sets[setName].filter(function (id) { return filesById[id] && !state.rejected[id]; });
  if (!ids.length) return null;
  var key = g + '|' + setName, last = lastPlayed[key], pool = ids;
  if (ids.length >= 2 && last) pool = ids.filter(function (x) { return x !== last; });
  var pick = pool[Math.floor(Math.random() * pool.length)];
  lastPlayed[key] = pick; return pick;
}
function previewPool(g, out) {
  var p = poolOf(g), pick = pickFrom(g, p.active);
  if (!pick) { out.textContent = 'Nothing selected in pool "' + p.active + '" yet. Tick "In pool" on candidates first.'; return; }
  play(pick, {});
  out.textContent = 'Played from pool "' + p.active + '" (' + p.sets[p.active].length + ' selected): ' + filesById[pick].title + ' [' + pick + ']';
  setStatus(out.textContent);
}

// ---------- effects tab ----------
var poolBarRefresh = {};
function licBadge(f) { var L = f.license; return (L.name + (L.version ? ' ' + L.version : '')); }
function fmtDur(s) { return s < 10 ? s.toFixed(2) + ' s' : s.toFixed(1) + ' s'; }
function levelText(f) { var l = f.local; return l.peakDbfs == null ? 'level unmeasured (lossy)' : 'peak ' + l.peakDbfs + ' / RMS ' + l.rmsDbfs + ' dBFS'; }
function buildCard(f, g) {
  var id = f.id;
  var cb = h('input', { type: 'checkbox', id: 'sel-' + g + '-' + id, onchange: function () { toggleSel(g, id, this.checked); } });
  var btn = h('button', { type: 'button', class: 'primary', 'aria-pressed': 'false', 'aria-label': 'Play ' + f.title, text: '▶ Play', onclick: function () { togglePlay(id); } });
  var star = h('button', { type: 'button', 'aria-pressed': state.shortlist[id] ? 'true' : 'false', text: '☆ Shortlist', onclick: function () { state.shortlist[id] = !state.shortlist[id]; if (!state.shortlist[id]) delete state.shortlist[id]; save(); refreshAll(); } });
  var rej = h('button', { type: 'button', 'aria-pressed': state.rejected[id] ? 'true' : 'false', text: '✕ Reject', onclick: function () { toggleReject(id); } });
  var trim = h('button', { type: 'button', title: 'Extra audition-only attenuation for this file', text: 'Quieter: ' + (state.trims[id] || 0) + ' dB', onclick: function () { var cur = state.trims[id] || 0, nxt = cur === 0 ? -6 : (cur === -6 ? -12 : 0); if (nxt) state.trims[id] = nxt; else delete state.trims[id]; this.textContent = 'Quieter: ' + nxt + ' dB'; save(); applyVolumes(); } });
  var status = h('div', { class: 'cardstatus', 'aria-live': 'polite' });
  var note = h('textarea', { class: 'note', 'aria-label': 'Note for ' + f.title, placeholder: 'Note (saved in this browser)', oninput: function () { var v = this.value; if (v) state.notes[id] = v; else delete state.notes[id]; save(); } });
  note.value = state.notes[id] || '';
  var chips = [h('span', { class: 'chip', text: fmtDur(f.local.durationS) }), h('span', { class: 'chip lic', text: licBadge(f) }), h('span', { class: 'chip', text: f.source.library })];
  f.flags.forEach(function (fl) { chips.push(h('span', { class: 'chip warn', text: flagLabel(fl) })); });
  var also = fileGroups(f).filter(function (x) { return x !== g; });
  if (also.length) chips.push(h('span', { class: 'chip', text: 'shared with: ' + also.map(groupLabel).join(', ') }));
  var L = f.license, S = f.source;
  var more = h('details', { class: 'more' }, h('summary', { text: 'Source, license, changes' }),
    h('dl', null,
      h('dt', { text: 'ID' }), h('dd', { text: f.id }),
      h('dt', { text: 'Creator' }), h('dd', { text: f.creator }),
      h('dt', { text: 'Source' }), h('dd', null, h('a', { href: S.entryUrl, target: '_blank', rel: 'noopener noreferrer', text: S.entryTitle || S.entryUrl })),
      h('dt', { text: 'License' }), h('dd', null, L.url ? h('a', { href: L.url, target: '_blank', rel: 'noopener noreferrer', text: licBadge(f) }) : licBadge(f), ' — ' + f.licenseEvidenceScope + ': ' + L.scope),
      L.note ? h('dt', { text: 'License note' }) : null, L.note ? h('dd', { text: L.note }) : null,
      h('dt', { text: 'Changes' }), h('dd', { text: f.changeNotice }),
      h('dt', { text: 'Credit text' }), h('dd', { text: f.attributionText }),
      h('dt', { text: 'Format' }), h('dd', { text: f.local.container + (f.local.codec ? '/' + f.local.codec : '') + ', ' + f.local.sampleRate + ' Hz, ' + f.local.channels + ' ch' + (f.local.bitDepth ? ', ' + f.local.bitDepth + '-bit' : '') + (f.local.kbps ? ', ' + f.local.kbps + ' kbps' : '') + ', ' + f.local.bytes + ' bytes' }),
      h('dt', { text: 'Level' }), h('dd', { text: levelText(f) + '; audition gain ' + f.auditionGainDb + ' dB (' + f.auditionGainNote + ')' }),

var FLAGS = { 'quiet': 'quiet file', 'weather-not-approved': 'weather audio not approved', 'human-imitation-not-a-duck': 'human imitation, not a duck', 'human-made-label': 'page says "human made"', 'member-provenance-pending': 'provenance pending', 'long-needs-trim': 'long source', '96kHz-source': '96 kHz source', 'loop-seam-unverified': 'loop seam unverified' };
function flagLabel(x) { return FLAGS[x] || x; }
function groupLabel(g) { return (groups.filter(function (r) { return r.id === g; })[0] || { label: g }).label; }
function toggleSel(g, id, on) {
  var set = activeSet(g), i = set.indexOf(id);

  if (!on && i >= 0) set.splice(i, 1);

}
function toggleReject(id) {
  if (state.rejected[id]) { delete state.rejected[id]; setStatus('Un-rejected ' + filesById[id].title + '.'); }
  else {
    state.rejected[id] = true; var removed = 0;
    Object.keys(state.pools).forEach(function (g) { Object.keys(state.pools[g].sets).forEach(function (n) { var s = state.pools[g].sets[n], i = s.indexOf(id); if (i >= 0) { s.splice(i, 1); removed++; } }); });

function renderEffects() {
  var root = $('p-effects'); root.textContent = '';
  var hide = h('input', { type: 'checkbox', id: 'hideRej', onchange: refreshAll });
  root.appendChild(h('div', { class: 'row' }, h('label', { class: 'row' }, hide, h('span', { text: 'Hide rejected' })), h('span', { class: 'chip', id: 'counts' })));
  groups.forEach(function (gr) {
    var g = gr.id;
    var sec = h('section', { class: 'role', id: 'role-' + g, 'aria-labelledby': 'h-' + g });
    sec.appendChild(h('h2', { id: 'h-' + g, text: gr.label }));
    sec.appendChild(h('p', { class: 'blurb', text: gr.blurb }));
    if (g === 'ambience') sec.appendChild(h('div', { class: 'notice warn', text: 'Optional and separate. Weather audio is not approved for production; thunder is intentionally not included.' }));
    var out = h('span', { class: 'grow', 'aria-live': 'polite' });
    var sel = h('select', { 'aria-label': 'Active pool for ' + gr.label, onchange: function () { poolOf(g).active = this.value; save(); refreshAll(); } });
    var newName = h('input', { type: 'text', placeholder: 'New pool name', 'aria-label': 'New pool name for ' + gr.label, size: 14, maxlength: 30 });
    var bar = h('div', { class: 'poolbar' },

      h('button', { type: 'button', text: 'Add pool', onclick: function () { var n = newName.value.trim(); if (!n) { out.textContent = 'Type a pool name first.'; return; } var p = poolOf(g); if (p.sets[n]) { out.textContent = 'A pool named "' + n + '" already exists.'; return; } p.sets[n] = []; p.active = n; newName.value = ''; save(); refreshAll(); } }), newName,

}
function refreshAll() {
  var hideR = $('hideRej') && $('hideRej').checked;

  Object.keys(els).forEach(function (id) {

      x.cb.checked = on; x.card.classList.toggle('sel', on); x.card.classList.toggle('rejected', !!state.rejected[id]);

  pooled = Object.keys(sel).length;
  if ($('counts')) $('counts').textContent = pooled + ' in pools · ' + Object.keys(state.shortlist).length + ' shortlisted · ' + Object.keys(state.rejected).length + ' rejected · ' + CAT.files.length + ' candidates';
  if ($('p-choices') && !$('p-choices').hidden) renderChoices();

// ---------- mocks ----------
function renderMocks() {
  var root = $('p-mocks'); root.textContent = '';
  root.appendChild(h('div', { class: 'notice', text: 'Audition mocks layer two sounds from YOUR selected pools (active pool of each purpose) to hear how they sit together. They are not game events: no real race, reveal or Receipt is represented. At most ' + MAX_VOICES + ' voices play at once.' }));
  var MOCKS = [['Reveal accent: card, then reward', ['card', 'reward']], ['Contact then audience reaction (no outcome implied)', ['contact', 'crowd']], ['Quack, then splash', ['duck', 'contact']]];
  MOCKS.forEach(function (m) {
    var out = h('div', { class: 'cardstatus', 'aria-live': 'polite' });
    var btn = h('button', { type: 'button', class: 'primary', text: '▶ Play mock', onclick: function () {
      var picks = m[1].map(function (g) { return pickFrom(g, poolOf(g).active); });
      var missing = m[1].filter(function (g, i) { return !picks[i]; });
      if (missing.length) { out.textContent = 'Select at least one sound in the pool for: ' + missing.map(groupLabel).join(', ') + '.'; out.className = 'cardstatus err'; return; }
      out.className = 'cardstatus'; stopAll();
      play(picks[0], { layer: true });
      mockTimer = setTimeout(function () { mockTimer = null; play(picks[1], { layer: true }); }, 250);
      out.textContent = 'Playing ' + filesById[picks[0]].title + ' then ' + filesById[picks[1]].title + ' (audition mock).';
    } });
    root.appendChild(h('div', { class: 'mock' }, h('strong', { text: m[0] }), h('div', { class: 'row' }, btn), out));
  });
}

// ---------- music ----------
function renderMusic() {
  var root = $('p-music'); root.textContent = '';
  root.appendChild(h('div', { class: 'notice', text: 'The two music candidates from the earlier audition, unchanged and kept separate from effects. Loop is off unless you tick it.' }));
  var grid = h('div', { class: 'grid' });
  CAT.music.forEach(function (m) {
    var loop = h('input', { type: 'checkbox', id: 'loop-' + m.id });
    var btn = h('button', { type: 'button', class: 'primary', 'aria-pressed': 'false', text: '▶ Play', onclick: function () { if (voices.has(m.id)) stopVoice(m.id, 'Stopped.'); else play(m.id, { kind: 'music', loop: loop.checked }); } });
    var status = h('div', { class: 'cardstatus', 'aria-live': 'polite' });
    var card = h('div', { class: 'card' }, h('div', { class: 'title', text: m.title }),
      h('div', { class: 'meta' }, h('span', { class: 'chip', text: fmtDur(m.durationS) }), h('span', { class: 'chip lic', text: m.license.name + ' ' + m.license.version })),
      h('div', { class: 'row' }, btn, h('label', { class: 'row' }, loop, h('span', { text: 'Loop' }))), status,
      h('div', { class: 'meta', text: m.creator }), h('a', { href: m.source, target: '_blank', rel: 'noopener noreferrer', text: 'Source page' }),

// ---------- choices / export ----------
function unknownIds() {
  var seen = {}; Object.keys(state.pools).forEach(function (g) { Object.keys(state.pools[g].sets).forEach(function (n) { state.pools[g].sets[n].forEach(function (id) { if (!filesById[id]) seen[id] = 1; }); }); });
  Object.keys(state.shortlist).concat(Object.keys(state.rejected), Object.keys(state.notes), Object.keys(state.trims)).forEach(function (id) { if (!filesById[id]) seen[id] = 1; });
  return Object.keys(seen);
}
function exportObject() {
  var ids = {}; Object.keys(state.pools).forEach(function (g) { Object.keys(state.pools[g].sets).forEach(function (n) { state.pools[g].sets[n].forEach(function (id) { ids[id] = 1; }); }); });
  Object.keys(state.shortlist).forEach(function (id) { ids[id] = 1; });
  var finfo = {}; Object.keys(ids).forEach(function (id) { var f = filesById[id]; finfo[id] = f ? { title: f.title, path: f.local.path, sha256: f.local.sha256 } : { missingFromCatalog: true }; });
  var pools = []; Object.keys(state.pools).forEach(function (g) { Object.keys(state.pools[g].sets).forEach(function (n) { if (state.pools[g].sets[n].length) pools.push({ role: g, pool: n, active: state.pools[g].active === n, fileIds: state.pools[g].sets[n].slice() }); }); });
  return { schema: 'qp18-owner-choices', schemaVersion: 1, catalogRevision: state.catalogRevision, currentCatalogRevision: CAT.catalogRevision, exportedAt: new Date().toISOString(),
    note: 'Owner audition preferences only; not verified game integration and not a production selection.',
    pools: pools, shortlistedIds: Object.keys(state.shortlist), rejectedIds: Object.keys(state.rejected), notes: state.notes, ownerTrimDb: state.trims, files: finfo, idsMissingFromCatalog: unknownIds() };
}
function renderChoices() {
  var root = $('p-choices'); root.textContent = '';
  var out = h('p', { 'aria-live': 'polite', text: '' });
  if (staleFrom) root.appendChild(h('div', { class: 'notice warn' }, h('p', { text: 'These choices were saved against catalog revision ' + staleFrom + '; the current catalog is ' + CAT.catalogRevision + '. Nothing was reset. IDs that no longer exist are listed below and kept until you remove them.' }),
    h('button', { type: 'button', text: 'Mark reviewed for revision ' + CAT.catalogRevision, onclick: function () { state.catalogRevision = CAT.catalogRevision; staleFrom = null; save(); renderChoices(); setStatus('Choices marked as reviewed for the current catalog.'); } })));
  if (!storageOK) root.appendChild(h('div', { class: 'notice warn', text: 'Saving in this browser is not working (private window or blocked storage). Export your choices before closing.' }));
  var pre = h('pre', { style: 'white-space:pre-wrap;word-break:break-word;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px;max-height:340px;overflow:auto' });
  pre.textContent = JSON.stringify(exportObject(), null, 1);
  var fileIn = h('input', { type: 'file', accept: 'application/json,.json', 'aria-label': 'Import choices JSON', onchange: function () {
    var f = this.files[0]; if (!f) return; var r = new FileReader();
    r.onload = function () { try { var o = JSON.parse(r.result); if (o.schema !== 'qp18-owner-choices') throw new Error('not a Quackpot audition export'); var n = blankState(); n.catalogRevision = o.catalogRevision || CAT.catalogRevision;
        (o.pools || []).forEach(function (p) { var pp = n.pools[p.role] = n.pools[p.role] || { active: 'Main', sets: { Main: [] } }; pp.sets[p.pool] = p.fileIds.slice(); if (p.active) pp.active = p.pool; });
        (o.shortlistedIds || []).forEach(function (id) { n.shortlist[id] = true; }); (o.rejectedIds || []).forEach(function (id) { n.rejected[id] = true; }); n.notes = o.notes || {}; n.trims = o.ownerTrimDb || {};
        state = n; staleFrom = n.catalogRevision !== CAT.catalogRevision ? n.catalogRevision : null; var ok = save(); refreshAll(); renderChoices(); setStatus('Imported choices' + (staleFrom ? ' (older catalog revision ' + staleFrom + '; unknown IDs are kept and listed)' : '') + (ok ? '.' : ', but they could not be saved in this browser.'), !ok); }
      catch (e) { setStatus('Import failed: ' + e.message, true); } };
    r.onerror = function () { setStatus('Could not read that file.', true); }; r.readAsText(f); } });
  var clearBtn = h('button', { type: 'button', class: 'danger', text: 'Clear all my choices…', onclick: function () {
    if (clearBtn.dataset.armed !== '1') { clearBtn.dataset.armed = '1'; clearBtn.textContent = 'Really clear everything? Press again to confirm'; setTimeout(function () { if (clearBtn.dataset.armed === '1') { clearBtn.dataset.armed = ''; clearBtn.textContent = 'Clear all my choices…'; } }, 6000); return; }
    stopAll(); state = blankState(); staleFrom = null; var failed = null; try { localStorage.removeItem(KEY); } catch (e) { failed = e; } refreshAll(); renderChoices();
    if (failed) setStatus('Cleared on screen, but saved data could not be removed (' + failed.name + ').', true); else setStatus('All choices cleared.'); } });
  root.appendChild(h('div', { class: 'row' },

      catch (e) { setStatus('Download failed (' + e.name + '). Copy the text below instead.', true); } } }),
    h('button', { type: 'button', text: 'Copy JSON', onclick: function () { var t = JSON.stringify(exportObject(), null, 1); if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(function () { setStatus('Copied.'); }, function () { setStatus('Copy blocked; select the text below manually.', true); }); else setStatus('Copy not available here; select the text below manually.', true); } }),
    h('label', null, 'Import: ', fileIn), clearBtn));
  root.appendChild(out);
  var unk = unknownIds(); if (unk.length) root.appendChild(h('div', { class: 'notice warn', text: 'IDs not in this catalog: ' + unk.join(', ') }));
  root.appendChild(h('h2', { text: 'What would be exported' })); root.appendChild(pre);
}

// ---------- credits ----------
function renderCredits() {

        h('dt', { text: 'License' }), h('dd', null, f.license.url ? h('a', { href: f.license.url, target: '_blank', rel: 'noopener noreferrer', text: licBadge(f) }) : licBadge(f), ' — ' + f.license.scope),
        h('dt', { text: 'Credit text' }), h('dd', { text: f.attributionText }), h('dt', { text: 'Changes' }), h('dd', { text: f.changeNotice }),
        h('dt', { text: 'Local file' }), h('dd', { text: f.local.path + '  (sha256 ' + f.local.sha256 + ')' }))));

  root.appendChild(h('h2', { text: 'Quarantined or out-of-scope leads' })); var ul2 = h('ul'); CAT.quarantined.forEach(function (g) { ul2.appendChild(h('li', { text: g })); }); root.appendChild(ul2);

// ---------- tabs ----------
var TABS = ['effects', 'mocks', 'music', 'choices', 'credits'];
function showTab(name) {
  stopAll();
  TABS.forEach(function (t) { var on = t === name; $('t-' + t).setAttribute('aria-selected', on ? 'true' : 'false'); $('p-' + t).hidden = !on; });
  if (name === 'choices') renderChoices();
  if (name === 'mocks') renderMocks();
}
TABS.forEach(function (t) { $('t-' + t).addEventListener('click', function () { showTab(t); }); $('t-' + t).addEventListener('keydown', function (e) { var i = TABS.indexOf(t); if (e.key === 'ArrowRight') { $('t-' + TABS[(i + 1) % TABS.length]).focus(); } if (e.key === 'ArrowLeft') { $('t-' + TABS[(i + TABS.length - 1) % TABS.length]).focus(); } }); });

load();

if (staleFrom) setStatus('Saved choices are from catalog revision ' + staleFrom + '; see "My choices". Nothing was reset.');
