<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quackpot sound audition</title>
<style>
:root{--bg:#f6f4ee;--panel:#fff;--ink:#1d2430;--muted:#5b6575;--line:#d9d4c7;--accent:#0b6b5e;--accent-ink:#fff;--warn:#8a4b00;--warnbg:#fff1d6;--bad:#9b1c1c;--badbg:#fde8e8;--chip:#ece8dc;--focus:#1a56db}
@media (prefers-color-scheme:dark){:root{--bg:#14181f;--panel:#1d232d;--ink:#e8ebf0;--muted:#a3adbd;--line:#333c4a;--accent:#47c2b0;--accent-ink:#06201b;--warn:#ffcf8a;--warnbg:#3a2c12;--bad:#ffb4b4;--badbg:#3a1a1a;--chip:#2a313d;--focus:#8ab4ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
header.top{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px}
header.top h1{font-size:1.05rem;margin:0 0 6px}
.bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.bar label{display:flex;align-items:center;gap:6px}
#status{margin:6px 0 0;min-height:1.4em;color:var(--muted)}
#status.err{color:var(--bad)}
main{max-width:1100px;margin:0 auto;padding:12px 16px 60px}
button,select,input[type=text],textarea{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;min-height:36px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.danger{border-color:var(--bad);color:var(--bad)}
button[aria-pressed=true]{background:var(--chip);border-color:var(--accent);font-weight:600}
button:disabled{opacity:.5;cursor:not-allowed}
nav.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
nav.tabs button[aria-selected=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.notice{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:10px 12px;margin:10px 0}
.notice.warn{background:var(--warnbg);color:var(--warn);border-color:var(--warn)}
.role{margin:18px 0}
.role>h2{margin:0 0 2px;font-size:1.15rem}
.role .blurb{color:var(--muted);margin:0 0 8px}
.poolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0 10px}
.poolbar .grow{flex:1 1 200px;color:var(--muted)}
h3.sub{margin:12px 0 6px;font-size:.95rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px}
.card.rejected{opacity:.55}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.card.playing{outline:2px solid var(--accent)}
.card .title{font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:4px 6px;font-size:.85rem;color:var(--muted)}
.chip{background:var(--chip);border-radius:999px;padding:1px 8px;font-size:.78rem;color:var(--ink)}
.chip.lic{border:1px solid var(--accent)}
.chip.warn{background:var(--warnbg);color:var(--warn)}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cardstatus{min-height:1.2em;font-size:.85rem;color:var(--muted)}
.cardstatus.err{color:var(--bad)}
details.more{font-size:.85rem}
details.more summary{cursor:pointer;color:var(--muted)}
details.more dl{margin:6px 0;display:grid;grid-template-columns:max-content 1fr;gap:2px 10px}
details.more dt{color:var(--muted)}
details.more dd{margin:0;word-break:break-word}
textarea.note{width:100%;min-height:2.2em;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 6px}
.sr{position:absolute;left:-9999px}
.mock{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;margin:8px 0}
table{border-collapse:collapse;width:100%}
td,th{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}
details.more summary{padding:7px 0;min-height:32px}
select,input[type=text]{min-height:36px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 6px}
@media (max-width:560px){.grid{grid-template-columns:1fr}header.top{padding:6px 12px}main{padding:10px 12px 60px}
header.top h1{font-size:.95rem;margin:0 0 4px}header.top h1 .chip{display:none}
.bar{gap:4px 10px}.bar label{font-size:.9rem}
#status{margin:4px 0 0;min-height:0;font-size:.85rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}}
</style>
</head>
<body>
<header class="top">
  <h1>Quackpot sound audition <span class="chip">report-only · catalog <span id="rev"></span></span></h1>
  <div class="bar">
    <button id="stopAll" class="primary" type="button">Stop all</button>
    <label>Master volume <input id="vol" type="range" min="0" max="100" value="60" aria-describedby="volOut"> <output id="volOut">60%</output></label>
    <label><input id="mute" type="checkbox"> Mute</label>
    <span class="chip" id="voiceCount" aria-live="off">0 playing</span>
  </div>
  <p id="status" role="status" aria-live="polite"></p>
</header>
<main>
  <nav class="tabs" role="tablist" aria-label="Sections">
    <button role="tab" id="t-effects" aria-selected="true" aria-controls="p-effects">Effects by purpose</button>
    <button role="tab" id="t-mocks" aria-selected="false" aria-controls="p-mocks">Audition mocks</button>
    <button role="tab" id="t-music" aria-selected="false" aria-controls="p-music">Music</button>
    <button role="tab" id="t-choices" aria-selected="false" aria-controls="p-choices">My choices</button>
    <button role="tab" id="t-credits" aria-selected="false" aria-controls="p-credits">Credits &amp; notices</button>
  </nav>
  <div class="notice warn" id="banner"></div>
  <section id="p-effects" role="tabpanel" aria-labelledby="t-effects"></section>
  <section id="p-mocks" role="tabpanel" aria-labelledby="t-mocks" hidden></section>
  <section id="p-music" role="tabpanel" aria-labelledby="t-music" hidden></section>
  <section id="p-choices" role="tabpanel" aria-labelledby="t-choices" hidden></section>
  <section id="p-credits" role="tabpanel" aria-labelledby="t-credits" hidden></section>
</main>
<noscript><p class="notice">This page needs JavaScript. Audio files are local; nothing is fetched from the network.</p></noscript>
<script src="catalog/catalog-data.js"></script>
<script>
(function () {
'use strict';
var CAT = window.QP18_CATALOG;
var $ = function (id) { return document.getElementById(id); };
function h(tag, attrs) {
  var e = document.createElement(tag);
  if (attrs) Object.keys(attrs).forEach(function (k) {

    else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, ''); else if (v !== false && v != null) e.setAttribute(k, v);
  });
  var add = function (c) { if (c == null) return; if (Array.isArray(c)) { c.forEach(add); return; } e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); };
  for (var i = 2; i < arguments.length; i++) add(arguments[i]);
  return e;
}
var MAX_VOICES = 3;
var KEY = 'qp18-audition-choices-v1';
if (!CAT) { document.body.insertBefore(h('p', { class: 'notice warn', text: 'catalog/catalog-data.js did not load, so there is nothing to audition. Keep it next to this page.' }), document.body.firstChild); return; }
$('rev').textContent = CAT.catalogRevision;
$('banner').textContent = 'Audition only. These are candidates chosen from names and metadata; nobody has listened to them yet. Selecting a sound here records an owner preference in this browser or an exported file; it does not wire anything into the game. All audio plays from local files; nothing is fetched or uploaded.';

var filesById = {}; CAT.files.forEach(function (f) { filesById[f.id] = f; });
var musicById = {}; CAT.music.forEach(function (m) { musicById[m.id] = m; });
var groups = CAT.roles;

// ---------- state ----------
var SCHEMA = 'qp18-owner-choices', SCHEMA_VERSION = 1;
var LIMITS = { fileBytes: 1048576, pools: 300, idsPerSet: 500, ids: 2000, name: 30, note: 2000 };
var ID_RE = /^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$/, ROLE_RE = /^[a-z][a-z0-9-]{0,39}$/, REV_RE = /^[A-Za-z0-9._-]{1,64}$/;
function isReserved(k) { return k === '__proto__' || k === 'constructor' || k === 'prototype'; }
function nmap() { return Object.create(null); } // keyed maps never inherit from Object.prototype
function isPlain(o) { return o !== null && typeof o === 'object' && !Array.isArray(o); }
function validName(n) { return typeof n === 'string' && n.length >= 1 && n.length <= LIMITS.name && n === n.trim() && !/[\u0000-\u001f\u007f]/.test(n) && !isReserved(n); }
function validId(id) { return typeof id === 'string' && ID_RE.test(id) && !isReserved(id); }
function blankState() { return { catalogRevision: CAT.catalogRevision, pools: nmap(), shortlist: nmap(), rejected: nmap(), notes: nmap(), trims: nmap() }; }
var state = blankState();
var storageOK = true, staleFrom = null, writesBlocked = false, rawSaved = null, recoveryReason = null;
function setStatus(msg, isErr) { var s = $('status'); s.textContent = msg; s.className = isErr ? 'err' : ''; }

// Validate an entire choices object into a DETACHED candidate state. Never touches live state or storage.
var KNOWN_TOP = ['schema', 'schemaVersion', 'catalogRevision', 'currentCatalogRevision', 'exportedAt', 'savedAt', 'note', 'pools', 'shortlistedIds', 'rejectedIds', 'notes', 'ownerTrimDb', 'files', 'idsMissingFromCatalog', 'rolesMissingFromCatalog'];
// First reserved own key anywhere in the parsed JSON (bounded depth/size); JSON.parse keeps "__proto__" as an own key, so it is visible here.
function reservedKeyPath(v, path, depth) {

  var keys = Object.keys(v);
  for (var i = 0; i < keys.length; i++) { if (isReserved(keys[i])) return path + '/' + keys[i]; }
  for (var j = 0; j < keys.length && j < 5000; j++) { var r = reservedKeyPath(v[keys[j]], path + '/' + keys[j], depth + 1); if (r) return r; }
  return null;
}
function parseChoices(o) {
  var errs = [], st = blankState(), rep = { ignored: [], unknownIds: [], unknownRoles: [] };
  function bad(m) { if (errs.length < 12) errs.push(m); else if (errs.length === 12) errs.push('…and more problems.'); }
  if (!isPlain(o)) return { ok: false, errors: ['The top level is not an object.'] };
  var rk = reservedKeyPath(o, '', 0);
  if (rk) return { ok: false, errors: ['The file contains the reserved key "' + rk + '" (__proto__, constructor and prototype are not allowed as keys).'] };
  if (o.schema !== SCHEMA) return { ok: false, errors: ['Not a Quackpot audition choices file (schema is ' + JSON.stringify(o.schema) + ').'] };
  if (o.schemaVersion !== SCHEMA_VERSION) return { ok: false, errors: ['Unsupported schemaVersion ' + JSON.stringify(o.schemaVersion) + '; this page reads version ' + SCHEMA_VERSION + '.'] };
  if (typeof o.catalogRevision !== 'string' || !REV_RE.test(o.catalogRevision)) bad('catalogRevision must be a short string.'); else st.catalogRevision = o.catalogRevision;
  var pools = o.pools === undefined ? [] : o.pools;
  if (!Array.isArray(pools)) bad('pools must be an array.');
  else if (pools.length > LIMITS.pools) bad('pools has too many records.');
  else {
    var seen = nmap(), activeBy = nmap();
    pools.forEach(function (p, i) {
      var w = 'pools[' + i + ']';
      if (!isPlain(p)) { bad(w + ' is not an object.'); return; }
      if (typeof p.role !== 'string' || !ROLE_RE.test(p.role) || isReserved(p.role)) { bad(w + '.role is not a valid purpose id.'); return; }
      if (!validName(p.pool)) { bad(w + '.pool is not a valid pool name (1-' + LIMITS.name + ' characters, no leading/trailing spaces, no reserved names).'); return; }
      if (!Array.isArray(p.fileIds)) { bad(w + '.fileIds must be an array of file ID strings.'); return; }
      if (p.fileIds.length > LIMITS.idsPerSet) { bad(w + '.fileIds is too long.'); return; }
      if (p.active !== undefined && typeof p.active !== 'boolean') { bad(w + '.active must be true or false.'); return; }
      var key = p.role + '|' + p.pool;
      if (seen[key]) { bad(w + ' repeats pool "' + p.pool + '" for ' + p.role + '.'); return; }
      seen[key] = true;
      var ids = [], dup = nmap(), ok = true;
      p.fileIds.forEach(function (id, j) {
        if (!validId(id)) { bad(w + '.fileIds[' + j + '] is not a valid file ID string.'); ok = false; }
        else if (dup[id]) { bad(w + ' lists ' + id + ' twice.'); ok = false; }
        else { dup[id] = true; ids.push(id); }
      });
      if (!ok) return;
      var role = st.pools[p.role] || (st.pools[p.role] = { active: null, sets: nmap() });
      role.sets[p.pool] = ids;
      if (p.active === true) { if (activeBy[p.role]) bad(w + ': purpose ' + p.role + ' has more than one active pool.'); else { activeBy[p.role] = true; role.active = p.pool; } }
    });
  }
  function idList(name, arr, into) {
    if (arr === undefined) return;
    if (!Array.isArray(arr)) { bad(name + ' must be an array of file ID strings.'); return; }
    if (arr.length > LIMITS.ids) { bad(name + ' is too long.'); return; }
    arr.forEach(function (id, j) { if (!validId(id)) bad(name + '[' + j + '] is not a valid file ID string.'); else if (into[id]) bad(name + ' lists ' + id + ' twice.'); else into[id] = true; });
  }
  idList('shortlistedIds', o.shortlistedIds, st.shortlist);
  idList('rejectedIds', o.rejectedIds, st.rejected);
  function idMap(name, m, into, conv) {
    if (m === undefined) return;
    if (!isPlain(m)) { bad(name + ' must be an object keyed by file ID.'); return; }
    var keys = Object.keys(m);
    if (keys.length > LIMITS.ids) { bad(name + ' has too many entries.'); return; }
    keys.forEach(function (k) { if (!validId(k)) { bad(name + ' has an invalid key.'); return; } var v = conv(m[k]); if (v === undefined) bad(name + '["' + k + '"] has an invalid value.'); else into[k] = v; });
  }
  idMap('notes', o.notes, st.notes, function (v) { return typeof v === 'string' && v.length <= LIMITS.note ? v : undefined; });
  idMap('ownerTrimDb', o.ownerTrimDb, st.trims, function (v) { return typeof v === 'number' && isFinite(v) && v >= -24 && v <= 0 ? v : undefined; });
  if (!errs.length) {
    Object.keys(st.rejected).forEach(function (id) { Object.keys(st.pools).forEach(function (r) { Object.keys(st.pools[r].sets).forEach(function (n) { if (st.pools[r].sets[n].indexOf(id) >= 0) bad(id + ' is both rejected and in pool "' + n + '" (' + r + ').'); }); }); });
  }
  if (errs.length) return { ok: false, errors: errs };
  Object.keys(st.pools).forEach(function (r) {
    var role = st.pools[r], sets = nmap();
    sets.Main = role.sets.Main || [];
    Object.keys(role.sets).forEach(function (n) { if (n !== 'Main') sets[n] = role.sets[n]; });
    role.sets = sets; if (!role.active) role.active = 'Main';
    if (!groups.some(function (g) { return g.id === r; })) rep.unknownRoles.push(r);
  });
  var uk = nmap(); [st.shortlist, st.rejected, st.notes, st.trims].forEach(function (m) { Object.keys(m).forEach(function (id) { if (!filesById[id]) uk[id] = true; }); });
  Object.keys(st.pools).forEach(function (r) { Object.keys(st.pools[r].sets).forEach(function (n) { st.pools[r].sets[n].forEach(function (id) { if (!filesById[id]) uk[id] = true; }); }); });
  rep.unknownIds = Object.keys(uk);
  rep.ignored = Object.keys(o).filter(function (k) { return KNOWN_TOP.indexOf(k) < 0; });
  return { ok: true, errors: [], state: st, report: rep };
}
// Earlier saved format (pools as an object keyed by purpose) -> canonical, so older browser saves still load.
function migrateStored(o) {
  if (!isPlain(o) || o.schema !== SCHEMA || !isPlain(o.pools)) return o;
  var pools = [];
  Object.keys(o.pools).forEach(function (r) { var p = o.pools[r]; if (isPlain(p) && isPlain(p.sets)) Object.keys(p.sets).forEach(function (n) { pools.push({ role: r, pool: n, active: p.active === n, fileIds: p.sets[n] }); }); });
  return { schema: SCHEMA, schemaVersion: o.schemaVersion, catalogRevision: o.catalogRevision, pools: pools, shortlistedIds: isPlain(o.shortlist) ? Object.keys(o.shortlist) : undefined, rejectedIds: isPlain(o.rejected) ? Object.keys(o.rejected) : undefined, notes: o.notes, ownerTrimDb: o.trims };
}
function serializeState(st) {
  var order = groups.map(function (g) { return g.id; });
  var roles = Object.keys(st.pools).sort(function (a, b) { var ia = order.indexOf(a), ib = order.indexOf(b); if (ia < 0) ia = 999; if (ib < 0) ib = 999; return ia - ib || (a < b ? -1 : a > b ? 1 : 0); });
  var pools = [];
  roles.forEach(function (r) {
    var role = st.pools[r], names = Object.keys(role.sets);
    if (names.length === 1 && names[0] === 'Main' && role.sets.Main.length === 0 && role.active === 'Main') return; // untouched default only
    names.forEach(function (n) { pools.push({ role: r, pool: n, active: role.active === n, fileIds: role.sets[n].slice() }); });
  });
  var notes = {}, trims = {};
  Object.keys(st.notes).forEach(function (k) { notes[k] = st.notes[k]; });
  Object.keys(st.trims).forEach(function (k) { trims[k] = st.trims[k]; });
  return { schema: SCHEMA, schemaVersion: SCHEMA_VERSION, catalogRevision: st.catalogRevision, currentCatalogRevision: CAT.catalogRevision, pools: pools, shortlistedIds: Object.keys(st.shortlist), rejectedIds: Object.keys(st.rejected), notes: notes, ownerTrimDb: trims };
}
function hasChoices(st) {
  if (Object.keys(st.shortlist).length || Object.keys(st.rejected).length || Object.keys(st.notes).length || Object.keys(st.trims).length) return true;
  return Object.keys(st.pools).some(function (r) { var p = st.pools[r], n = Object.keys(p.sets); return n.length > 1 || p.active !== 'Main' || p.sets.Main.length > 0; });
}
function summarize(st) {
  var u = nmap(), np = 0; Object.keys(st.pools).forEach(function (r) { Object.keys(st.pools[r].sets).forEach(function (n) { np++; st.pools[r].sets[n].forEach(function (id) { u[id] = true; }); }); });
  return Object.keys(u).length + ' sounds in pools (' + np + ' pools incl. empty), ' + Object.keys(st.shortlist).length + ' shortlisted, ' + Object.keys(st.rejected).length + ' rejected, ' + Object.keys(st.notes).length + ' notes';
}
function load() {
  var raw;
  try { raw = localStorage.getItem(KEY); } catch (e) { storageOK = false; setStatus('Saved choices are unavailable in this browser (' + e.name + '). You can still work this visit; use Download on "My choices" to keep them.', true); return; }
  if (raw === null) return;
  rawSaved = raw;
  var res;
  try { res = parseChoices(migrateStored(JSON.parse(raw))); } catch (e) { res = { ok: false, errors: ['Saved data is not valid JSON (' + e.name + ').'] }; }

  else { writesBlocked = true; recoveryReason = res.errors.join(' '); }
}
function save() {
  if (writesBlocked) { setStatus('Not saved: unreadable saved data in this browser is being preserved untouched. Open "My choices" to download it, import a file, or discard it.', true); return false; }
  try { var raw = JSON.stringify(Object.assign(serializeState(state), { savedAt: new Date().toISOString() })); localStorage.setItem(KEY, raw); rawSaved = raw; storageOK = true; return true; }
  catch (e) { storageOK = false; setStatus('Could not save choices in this browser (' + e.name + '). Use Download on "My choices" to keep them.', true); return false; }
}
function poolOf(g) { var p = state.pools[g]; if (!p) p = state.pools[g] = { active: 'Main', sets: nmap() }; if (!p.sets.Main) p.sets.Main = []; if (!p.sets[p.active]) p.active = 'Main'; return p; }
function activeSet(g) { var p = poolOf(g); return p.sets[p.active]; }
function groupOfRole(r) { return r.split('.')[0]; }
function fileGroups(f) { var s = {}; f.roles.forEach(function (r) { s[groupOfRole(r)] = 1; }); return Object.keys(s); }
function isSelectedAnywhere(id) { return Object.keys(state.pools).some(function (g) { return Object.keys(state.pools[g].sets).some(function (n) { return state.pools[g].sets[n].indexOf(id) >= 0; }); }); }

// ---------- playback ----------
var voices = new Map(); // id -> { audio, kind }
var els = {}; // id -> { card, btn, status }
function dbToGain(db) { return Math.pow(10, Math.min(0, db || 0) / 20); }
function clamp01(x) { return Math.max(0, Math.min(1, x)); }
function master() { return $('mute').checked ? 0 : $('vol').value / 100; }
function effVol(id, kind) {
  if (kind === 'music') return clamp01(master() * 0.8);
  var f = filesById[id];
  return clamp01(master() * dbToGain(f.auditionGainDb) * dbToGain(state.trims[id] || 0));
}
function updateVoiceCount() { $('voiceCount').textContent = voices.size + ' playing'; }
function setPlayingUI(id, playing) {
  var e = els[id]; if (!e) return;
  e.forEach(function (x) { x.card.classList.toggle('playing', playing); x.btn.textContent = playing ? '■ Stop' : '▶ Play'; x.btn.setAttribute('aria-pressed', playing ? 'true' : 'false'); });
}
function cardStatus(id, msg, isErr) { var e = els[id]; if (!e) return; e.forEach(function (x) { x.status.textContent = msg || ''; x.status.className = 'cardstatus' + (isErr ? ' err' : ''); }); }
function stopVoice(id, why) {
  var v = voices.get(id); if (!v) return;
  voices.delete(id);
  v.audio.onended = v.audio.onerror = v.audio.onpause = v.audio.onplaying = null;
  try { v.audio.pause(); v.audio.currentTime = 0; } catch (e) { /* element may have failed to load */ }
  v.audio.removeAttribute('src'); try { v.audio.load(); } catch (e) { }
  setPlayingUI(id, false); updateVoiceCount();
  cardStatus(id, why || 'Stopped.', false);
  if (v.onState) { try { v.onState('stopped', why || 'Stopped.'); } catch (e) { } }
}

    if (b.dataset.armed !== '1') { b.dataset.armed = '1'; b.textContent = armedLabel; setTimeout(function () { if (b.dataset.armed === '1') { b.dataset.armed = ''; b.textContent = label; } }, 6000); return; }
    b.dataset.armed = ''; b.textContent = label; onConfirm();
  } });
  return b;
}
function renderChoices() {
  var root = $('p-choices'); root.textContent = '';
  if (writesBlocked) {
    root.appendChild(h('div', { class: 'notice warn' },
      h('p', { text: 'Saved choices in this browser could not be read, so they have been left untouched and nothing you do this visit is saved. Reason: ' + recoveryReason }),
      h('div', { class: 'row' },
        h('button', { type: 'button', text: 'Download the saved data as it is', onclick: function () { var e = downloadText(rawSaved || '', 'quackpot-audition-unreadable-saved-data.txt', 'text/plain'); setStatus(e ? 'Download failed (' + e.name + ').' : 'Download started: the unreadable saved data, byte for byte.', !!e); } }),
        armedButton('Discard saved data and start fresh…', 'Really discard it? Press again to confirm', resetAll)),
      h('p', { text: 'Importing a valid choices file also replaces it, after you confirm below.' })));
  }
  if (staleFrom) root.appendChild(h('div', { class: 'notice warn' }, h('p', { text: 'These choices were saved against catalog revision ' + staleFrom + '; the current catalog is ' + CAT.catalogRevision + '. Nothing was reset. IDs that no longer exist are listed below and kept until you remove them.' }),
    h('button', { type: 'button', text: 'Mark reviewed for revision ' + CAT.catalogRevision, onclick: function () {
      var prev = state.catalogRevision; state.catalogRevision = CAT.catalogRevision;
      if (save()) { staleFrom = null; renderChoices(); setStatus('Choices marked as reviewed for the current catalog and saved.'); }
      else { state.catalogRevision = prev; renderChoices(); setStatus('Not marked reviewed: the choices could not be saved. They are still on revision ' + prev + '.', true); }
    } })));
  if (!storageOK && !writesBlocked) root.appendChild(h('div', { class: 'notice warn', text: 'Saving in this browser is not working (private window or blocked storage). Choices live only in this page; download them before closing.' }));
  var pre = h('pre', { style: 'white-space:pre-wrap;word-break:break-word;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px;max-height:340px;overflow:auto' });
  pre.textContent = JSON.stringify(exportObject(), null, 1);
  var fileIn = h('input', { type: 'file', accept: 'application/json,.json', 'aria-label': 'Import choices JSON', onchange: function () {
    var f = this.files[0]; this.value = ''; if (!f) return;
    if (f.size > LIMITS.fileBytes) { failImport('The file is larger than 1 MB.'); return; }
    var r = new FileReader(); r.onload = function () { handleImportText(String(r.result), f.name); }; r.onerror = function () { failImport('The file could not be read.'); }; r.readAsText(f); } });
  if (pendingImport) {
    var c = pendingImport, rp = c.report;
    root.appendChild(h('div', { class: 'notice warn', role: 'group', 'aria-label': 'Confirm replacing your choices' },
      h('p', { text: 'Replace your current choices with "' + c.name + '"?' }),
      h('p', { text: 'Current: ' + (hasChoices(state) ? summarize(state) : 'nothing chosen') + '.' }),
      h('p', { text: 'Import (catalog revision ' + c.state.catalogRevision + '): ' + summarize(c.state) + '.' }),
      rp.unknownIds.length ? h('p', { text: 'IDs not in this catalog (kept): ' + rp.unknownIds.join(', ') }) : null,
      rp.unknownRoles.length ? h('p', { text: 'Purposes not in this catalog (kept): ' + rp.unknownRoles.join(', ') }) : null,
      rp.ignored.length ? h('p', { text: 'Unrecognized top-level fields ignored: ' + rp.ignored.join(', ') }) : null,
      writesBlocked ? h('p', { text: 'This will overwrite the unreadable saved data. Download it first if you may need it.' }) : null,
      h('div', { class: 'row' },
        hasChoices(state) ? h('button', { type: 'button', text: 'Download backup of current choices', onclick: function () { var e = downloadText(JSON.stringify(exportObject(), null, 1), 'quackpot-audition-backup-' + CAT.catalogRevision + '.json', 'application/json'); setStatus(e ? 'Backup download failed (' + e.name + '); copy the text below instead.' : 'Backup download started.', !!e); } }) : null,
        h('button', { type: 'button', class: 'primary', text: 'Replace current choices', onclick: function () { applyImport(pendingImport); } }),
        h('button', { type: 'button', text: 'Cancel import', onclick: function () { pendingImport = null; renderChoices(); setStatus('Import cancelled; nothing was changed.'); } }))));
  }
  root.appendChild(h('div', { class: 'row' },
    h('button', { type: 'button', class: 'primary', text: 'Download choices (JSON)', onclick: function () { var e = downloadText(JSON.stringify(exportObject(), null, 1), 'quackpot-audition-choices-' + CAT.catalogRevision + '.json', 'application/json'); setStatus(e ? 'Download failed (' + e.name + '). Copy the text below instead.' : 'Download started. Check your Downloads folder; if nothing appears, copy the text below.', !!e); } }),
    h('button', { type: 'button', text: 'Copy JSON', onclick: function () { var t = JSON.stringify(exportObject(), null, 1); if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(function () { setStatus('Copied.'); }, function () { setStatus('Copy blocked; select the text below manually.', true); }); else setStatus('Copy not available here; select the text below manually.', true); } }),
    h('label', null, 'Import: ', fileIn),
    armedButton('Clear all my choices…', 'Really clear everything? Press again to confirm', resetAll)));
  root.appendChild(h('p', { class: 'cardstatus', text: 'Tip: download a copy before importing or clearing. Import checks the whole file first and changes nothing if anything is wrong.' }));
  var unk = unknownIds(); if (unk.length) root.appendChild(h('div', { class: 'notice warn', text: 'IDs not in this catalog (kept): ' + unk.join(', ') }));
  var ur = unknownRoles(); if (ur.length) root.appendChild(h('div', { class: 'notice warn', text: 'Purposes not in this catalog (kept): ' + ur.join(', ') }));
  root.appendChild(h('h2', { text: 'What would be exported' })); root.appendChild(pre);
}

// ---------- credits ----------
function renderCredits() {
  var root = $('p-credits'); root.textContent = '';
  root.appendChild(h('div', { class: 'notice', text: 'Factual sources, licenses and changes for ALL ' + CAT.files.length + ' auditionable effects and ' + CAT.music.length + ' music tracks, whether or not anything is selected. This is report-only information, outside the fictional game; production Credits would later list only shipped assets. The same data is in catalog/ATTRIBUTIONS.md, with captured page notices in catalog/notices/.' }));
  CAT.files.forEach(function (f) {
    root.appendChild(h('details', { class: 'more' }, h('summary', { text: f.id + ' — ' + f.title + ' — ' + licBadge(f) }),
      h('dl', null, h('dt', { text: 'Creator' }), h('dd', { text: f.creator }), h('dt', { text: 'Source' }), h('dd', null, h('a', { href: f.source.entryUrl, target: '_blank', rel: 'noopener noreferrer', text: f.source.entryUrl })),
        h('dt', { text: 'License' }), h('dd', null, f.license.url ? h('a', { href: f.license.url, target: '_blank', rel: 'noopener noreferrer', text: licBadge(f) }) : licBadge(f), ' — ' + f.license.scope),
        h('dt', { text: 'Credit text' }), h('dd', { text: f.attributionText }), h('dt', { text: 'Changes' }), h('dd', { text: f.changeNotice }),
        h('dt', { text: 'Local file' }), h('dd', { text: f.local.path + '  (sha256 ' + f.local.sha256 + ')' }))));
  });
  root.appendChild(h('h2', { text: 'Music (' + CAT.music.length + ')' }));
  CAT.music.forEach(function (m) {
    root.appendChild(h('details', { class: 'more', 'data-credit': m.id }, h('summary', { text: m.id + ' — ' + m.title + ' (music) — ' + m.license.name + ' ' + m.license.version }),
      h('dl', null, h('dt', { text: 'Creator' }), h('dd', { text: m.creator }),
        h('dt', { text: 'Source' }), h('dd', null, h('a', { href: m.source, target: '_blank', rel: 'noopener noreferrer', text: m.source })),
        h('dt', { text: 'License' }), h('dd', null, h('a', { href: m.license.url, target: '_blank', rel: 'noopener noreferrer', text: m.license.name + ' ' + m.license.version }), ' — ' + m.licenseScope),
        h('dt', { text: 'Credit text' }), h('dd', { text: m.attributionText }), h('dt', { text: 'Changes' }), h('dd', { text: m.changeNotice }),
        h('dt', { text: 'Local file' }), h('dd', { text: m.path + '  (sha256 ' + m.sha256 + ')' }), h('dt', { text: 'Provenance record' }), h('dd', { text: m.provenanceRef }))));
  });
  root.appendChild(h('h2', { text: 'Gaps (reported, not padded)' })); var ul = h('ul'); CAT.gaps.forEach(function (g) { ul.appendChild(h('li', { text: g })); }); root.appendChild(ul);
  root.appendChild(h('h2', { text: 'Quarantined or out-of-scope leads' })); var ul2 = h('ul'); CAT.quarantined.forEach(function (g) { ul2.appendChild(h('li', { text: g })); }); root.appendChild(ul2);
}

// ---------- tabs ----------
var TABS = ['effects', 'mocks', 'music', 'choices', 'credits'];
function showTab(name) {
  stopAll();
  TABS.forEach(function (t) { var on = t === name; $('t-' + t).setAttribute('aria-selected', on ? 'true' : 'false'); $('p-' + t).hidden = !on; });
  if (name === 'choices') renderChoices();
  if (name === 'mocks') renderMocks();
}
TABS.forEach(function (t) { $('t-' + t).addEventListener('click', function () { showTab(t); }); $('t-' + t).addEventListener('keydown', function (e) { var i = TABS.indexOf(t); if (e.key === 'ArrowRight') { $('t-' + TABS[(i + 1) % TABS.length]).focus(); } if (e.key === 'ArrowLeft') { $('t-' + TABS[(i + TABS.length - 1) % TABS.length]).focus(); } }); });

load();
renderEffects(); renderMusic(); renderCredits(); refreshAll();
if (writesBlocked) setStatus('Saved choices in this browser could not be read. They are preserved untouched and nothing is saved this visit; open "My choices" to download, replace or discard them.', true);
else if (staleFrom) setStatus('Saved choices are from catalog revision ' + staleFrom + '; see "My choices". Nothing was reset.');
else if (!storageOK) { /* status already set */ } else setStatus('Ready. Nothing plays until you press Play. Esc stops everything.');
})();
