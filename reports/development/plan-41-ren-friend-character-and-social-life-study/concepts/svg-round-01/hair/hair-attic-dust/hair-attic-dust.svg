<rect width="240" height="300" fill="#efe3cc"/>

<!-- ===== LAYER TORSO (behind the neck). OUTFIT TASKS: replace this group. Baseline: striped tee + teal overalls. ===== -->
<g id="LAYER-torso">
  <path class="l3" fill="#f1e3c8" d="M24 300 C24 236 66 208 120 208 C174 208 216 236 216 300Z"/>
  <g clip-path="url(#base-tclip)" stroke="#c76b3d" stroke-width="5" fill="none"><path d="M20 252 Q120 222 220 252"/><path d="M20 272 Q120 242 220 272"/><path d="M20 292 Q120 262 220 292"/></g>
  <path class="l3" fill="#4f6d7a" d="M74 218 L94 211 L98 242 L82 244Z"/>
  <path class="l3" fill="#4f6d7a" d="M146 211 L166 218 L158 244 L142 242Z"/>
  <path class="l3" fill="#4f6d7a" d="M82 240 Q120 250 158 240 L162 300 L78 300Z"/>
  <circle cx="88" cy="248" r="4" fill="#d9a441" stroke="#3a2c26" stroke-width="2"/><circle cx="152" cy="248" r="4" fill="#d9a441" stroke="#3a2c26" stroke-width="2"/>
  <rect x="104" y="268" width="32" height="22" rx="4" fill="#42606c" class="l2"/>
</g>

<use href="#base-neck"/>

<!-- ===== LAYER COLLAR (in front of the neck, behind the head and chin). OUTFIT TASKS: collars, scarf, turtleneck. Empty by default. ===== -->
<g id="LAYER-collar"></g>

<use href="#base-ears"/>
<use href="#base-head"/>
<use href="#base-face"/>

<!-- ===== LAYER HAIR. HAIR TASKS: replace this line/group. Baseline: short tapered curls (cloud of circles). ===== -->
<g id="LAYER-hair">
  <use href="#base-hs-shapes" class="hair l3"/><use href="#base-hs-shapes" class="hair" stroke="none"/>
  <g clip-path="url(#hair-attic-dust-clip)">
