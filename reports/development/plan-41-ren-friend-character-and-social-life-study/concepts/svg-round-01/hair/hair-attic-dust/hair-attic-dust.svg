    <path d="M168 42 Q164 50 168 54"/><path d="M158 38 Q154 48 160 58"/><path d="M148 35 Q146 46 154 58"/>
    <path d="M170 56 Q166 62 170 70"/>
    <path d="M112 44 Q100 50 96 70"/>
