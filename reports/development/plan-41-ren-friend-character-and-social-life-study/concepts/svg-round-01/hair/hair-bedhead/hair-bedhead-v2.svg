<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 300" width="720" height="900" role="img" aria-label="Ren, bedhead hair v2, mid-warm complexion">
<style>
  svg{--skin:#a8703f;--shade:#8a5428;--blush:#c9784f;--hair:#2a1d17}
  .skin{fill:var(--skin)}.shade{fill:var(--shade)}.blush{fill:var(--blush)}.hair{fill:var(--hair)}
  .l3{stroke:#3a2c26;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
  .l2{stroke:#3a2c26;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
</style>
<defs>
  <clipPath id="base-tclip"><path d="M24 300 C24 236 66 208 120 208 C174 208 216 236 216 300Z"/></clipPath>
  <g id="base-neck"><path class="skin l3" d="M102 150 L102 214 Q120 226 138 214 L138 150Z"/><path class="shade" d="M104 178 Q120 194 136 178 L136 196 Q120 208 104 196Z"/></g>
  <g id="base-ears"><circle class="skin l3" cx="70" cy="122" r="10"/><circle class="skin l3" cx="170" cy="122" r="10"/></g>
  <path id="base-head" class="skin l3" d="M70 112 C70 70 92 52 120 52 C148 52 170 70 170 112 C170 148 148 176 120 176 C92 176 70 148 70 112 Z"/>
  <g id="base-face">
    <ellipse class="blush" cx="90" cy="144" rx="10" ry="6" opacity=".45"/><ellipse class="blush" cx="150" cy="144" rx="10" ry="6" opacity=".45"/>
    <circle cx="101" cy="122" r="6" fill="#2b1a14"/><circle cx="139" cy="122" r="6" fill="#2b1a14"/>
    <circle cx="103" cy="120" r="1.8" fill="#fff"/><circle cx="141" cy="120" r="1.8" fill="#fff"/>
    <path class="l2" fill="none" d="M90 109 Q101 103 112 108"/><path class="l2" fill="none" d="M128 108 Q139 103 150 109"/>
    <path class="l2" fill="none" d="M120 128 Q115 140 122 142"/>
    <path class="l2" fill="none" d="M106 155 Q120 165 134 155"/>
  </g>
  <g id="base-hs-shapes">
    <circle cx="78" cy="88" r="16"/><circle cx="86" cy="66" r="16"/><circle cx="104" cy="54" r="16"/><circle cx="122" cy="50" r="16"/>
    <circle cx="140" cy="54" r="16"/><circle cx="158" cy="66" r="16"/><circle cx="166" cy="88" r="16"/><ellipse cx="122" cy="72" rx="46" ry="22"/>
  </g>
  <g id="base-tat" fill="none" stroke="#2f3a5c" stroke-opacity=".85" stroke-width="2" stroke-linecap="round"><path d="M139 188 Q145 200 140 212"/><path d="M143 197 Q151 195 153 188"/><path d="M142 203 Q134 202 131 196"/></g>
  <g id="base-acc">
    <circle cx="68" cy="138" r="9" fill="none" stroke="#3a2c26" stroke-width="5.5"/><circle cx="68" cy="138" r="9" fill="none" stroke="#d9a441" stroke-width="3"/>
    <circle cx="171" cy="132" r="4" fill="#d9a441" stroke="#3a2c26" stroke-width="2"/>
  </g>
  <g id="base-pencil"><path d="M168 118 L158 98" stroke="#3a2c26" stroke-width="7" stroke-linecap="round"/><path d="M168 118 L158 98" stroke="#e0b341" stroke-width="4" stroke-linecap="round"/></g>
  <g id="hair-bedhead-v2-mass">
    <path d="M66 110 C64 86 72 64 88 52 C102 42 124 38 142 42 C158 46 170 56 178 70 L178 98 L152 102 C132 98 108 98 90 104 Q76 110 66 110 Z"/>
    <circle cx="104" cy="46" r="9"/><circle cx="130" cy="40" r="9"/><circle cx="150" cy="44" r="9"/>
    <circle cx="176" cy="72" r="11"/><circle cx="196" cy="74" r="12"/><circle cx="210" cy="92" r="11"/><circle cx="196" cy="102" r="10"/><circle cx="178" cy="100" r="8"/>
    <path d="M98 50 Q90 40 84 30 Q102 38 116 44 Z"/>
    <path d="M136 44 Q144 38 157 31 Q157 42 160 50 Z"/>
    <path d="M172 66 Q188 60 208 56 Q198 66 186 78 Z"/>
    <path d="M204 84 Q218 78 230 80 Q220 88 210 96 Z"/>
    <path d="M200 100 Q214 104 224 116 Q212 114 202 110 Z"/>
  </g>
</defs>
<rect width="240" height="300" fill="#efe3cc"/>

<!-- ===== LAYER TORSO (behind the neck). OUTFIT TASKS: replace this group. Baseline: striped tee + teal overalls. ===== -->
<g id="LAYER-torso">
  <path class="l3" fill="#f1e3c8" d="M24 300 C24 236 66 208 120 208 C174 208 216 236 216 300Z"/>
  <g clip-path="url(#base-tclip)" stroke="#c76b3d" stroke-width="5" fill="none"><path d="M20 252 Q120 222 220 252"/><path d="M20 272 Q120 242 220 272"/><path d="M20 292 Q120 262 220 292"/></g>
  <path class="l3" fill="#4f6d7a" d="M74 218 L94 211 L98 242 L82 244Z"/>
  <path class="l3" fill="#4f6d7a" d="M146 211 L166 218 L158 244 L142 242Z"/>
  <path class="l3" fill="#4f6d7a" d="M82 240 Q120 250 158 240 L162 300 L78 300Z"/>
  <circle cx="88" cy="248" r="4" fill="#d9a441" stroke="#3a2c26" stroke-width="2"/><circle cx="152" cy="248" r="4" fill="#d9a441" stroke="#3a2c26" stroke-width="2"/>
  <rect x="104" y="268" width="32" height="22" rx="4" fill="#42606c" class="l2"/>
</g>

<use href="#base-neck"/>

<!-- ===== LAYER COLLAR (in front of the neck, behind the head and chin). OUTFIT TASKS: collars, scarf, turtleneck. Empty by default. ===== -->
<g id="LAYER-collar"></g>

<use href="#base-ears"/>
<use href="#base-head"/>
<use href="#base-face"/>

<!-- ===== LAYER HAIR. Bedhead v2: flattened left side, wide low right bulge, short tufts and stray loops between the outline and fill passes. ===== -->
<g id="LAYER-hair">
  <use href="#hair-bedhead-v2-mass" class="hair l3"/>
  <path d="M214 74 C216 62 230 62 228 70 C226 76 220 76 221 71" fill="none" stroke="#3a2c26" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M214 74 C216 62 230 62 228 70 C226 76 220 76 221 71" fill="none" style="stroke:var(--hair)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M222 96 C230 92 230 104 222 104 C216 104 216 98 220 98" fill="none" stroke="#3a2c26" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M222 96 C230 92 230 104 222 104 C216 104 216 98 220 98" fill="none" style="stroke:var(--hair)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <use href="#hair-bedhead-v2-mass" class="hair" stroke="none"/>
</g>

<!-- Tattoo (delete this line if a garment covers the neck sprout), earrings, pencil (delete or move it if a hair covering would hide it) -->
<use href="#base-tat"/>
<use href="#base-acc"/>
<use href="#base-pencil"/>
</svg>
