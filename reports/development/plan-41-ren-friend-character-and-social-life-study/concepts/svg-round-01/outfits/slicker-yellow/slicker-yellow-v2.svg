<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 300" width="720" height="900" role="img" aria-label="Ren concept drawing: slicker-yellow-v2">
<style>
  svg{--skin:#a8703f;--shade:#8a5428;--blush:#c9784f;--hair:#2a1d17}
  .skin{fill:var(--skin)}.shade{fill:var(--shade)}.blush{fill:var(--blush)}.hair{fill:var(--hair)}
  .l3{stroke:#3a2c26;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
  .l2{stroke:#3a2c26;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
</style>
<defs>
  <clipPath id="base-tclip"><path d="M24 300 C24 236 66 208 120 208 C174 208 216 236 216 300Z"/></clipPath>
  <g id="base-neck"><path class="skin l3" d="M102 150 L102 214 Q120 226 138 214 L138 150Z"/><path class="shade" d="M104 178 Q120 194 136 178 L136 196 Q120 208 104 196Z"/></g>
  <g id="base-ears"><circle class="skin l3" cx="70" cy="122" r="10"/><circle class="skin l3" cx="170" cy="122" r="10"/></g>
  <path id="base-head" class="skin l3" d="M70 112 C70 70 92 52 120 52 C148 52 170 70 170 112 C170 148 148 176 120 176 C92 176 70 148 70 112 Z"/>
  <g id="base-face">
    <ellipse class="blush" cx="90" cy="144" rx="10" ry="6" opacity=".45"/><ellipse class="blush" cx="150" cy="144" rx="10" ry="6" opacity=".45"/>
    <circle cx="101" cy="122" r="6" fill="#2b1a14"/><circle cx="139" cy="122" r="6" fill="#2b1a14"/>
    <circle cx="103" cy="120" r="1.8" fill="#fff"/><circle cx="141" cy="120" r="1.8" fill="#fff"/>
    <path class="l2" fill="none" d="M90 109 Q101 103 112 108"/><path class="l2" fill="none" d="M128 108 Q139 103 150 109"/>
    <path class="l2" fill="none" d="M120 128 Q115 140 122 142"/>
    <path class="l2" fill="none" d="M106 155 Q120 165 134 155"/>
  </g>
  <g id="base-hs-shapes">
    <circle cx="78" cy="88" r="16"/><circle cx="86" cy="66" r="16"/><circle cx="104" cy="54" r="16"/><circle cx="122" cy="50" r="16"/>
    <circle cx="140" cy="54" r="16"/><circle cx="158" cy="66" r="16"/><circle cx="166" cy="88" r="16"/><ellipse cx="122" cy="72" rx="46" ry="22"/>
  </g>
  <g id="base-tat" fill="none" stroke="#2f3a5c" stroke-opacity=".85" stroke-width="2" stroke-linecap="round"><path d="M139 188 Q145 200 140 212"/><path d="M143 197 Q151 195 153 188"/><path d="M142 203 Q134 202 131 196"/></g>
  <g id="base-acc">
    <circle cx="68" cy="138" r="9" fill="none" stroke="#3a2c26" stroke-width="5.5"/><circle cx="68" cy="138" r="9" fill="none" stroke="#d9a441" stroke-width="3"/>
    <circle cx="171" cy="132" r="4" fill="#d9a441" stroke="#3a2c26" stroke-width="2"/>
  </g>
  <g id="base-pencil"><path d="M168 118 L158 98" stroke="#3a2c26" stroke-width="7" stroke-linecap="round"/><path d="M168 118 L158 98" stroke="#e0b341" stroke-width="4" stroke-linecap="round"/></g>
</defs>
<rect width="240" height="300" fill="#efe3cc"/>

<!-- ===== LAYER TORSO (behind the neck). OUTFIT TASKS: replace this group. slicker-yellow-v2: rolled hood down behind the neck (outer rim, seam, dark lining), jacket body with sloped raglan shoulders, long sleeves to the bottom edge, front placket with three toggles. ===== -->
<g id="LAYER-torso">
  <path id="slicker-yellow-v2-hood" class="l3" fill="#e3b83a" d="M40 252 C36 200 70 158 120 156 C170 158 204 200 200 252 L200 290 L40 290 Z"/>
  <path id="slicker-yellow-v2-lining" class="l2" fill="#b8891f" d="M60 252 C60 204 84 166 120 164 C156 166 180 204 180 252 L180 290 L60 290 Z"/>
  <path id="slicker-yellow-v2-hood-seam" class="l2" fill="none" d="M50 252 C48 206 74 170 120 168 C166 170 192 206 190 252"/>
  <path id="slicker-yellow-v2-sleeve-l" class="l3" fill="#e3b83a" d="M98 212 L48 232 C36 242 30 266 28 300 L68 300 L68 262 Q84 236 98 212 Z"/>
  <path id="slicker-yellow-v2-sleeve-r" class="l3" fill="#e3b83a" d="M142 212 L192 232 C204 242 210 266 212 300 L172 300 L172 262 Q156 236 142 212 Z"/>
  <path id="slicker-yellow-v2-body" class="l3" fill="#e3b83a" d="M68 300 L68 262 Q84 236 98 212 Q120 222 142 212 Q156 236 172 262 L172 300 Z"/>
  <path id="slicker-yellow-v2-placket" class="l2" fill="none" d="M106 216 L106 300 M134 216 L134 300 M120 220 L120 300"/>
  <path id="slicker-yellow-v2-cords" class="l2" fill="none" d="M111 242 Q104 250 102 258 M129 242 Q136 250 138 258 M111 264 Q104 272 102 280 M129 264 Q136 272 138 280 M111 286 Q104 292 102 298 M129 286 Q136 292 138 298"/>
  <rect id="slicker-yellow-v2-toggle-1" class="l2" fill="#6b4428" x="111" y="239" width="18" height="6" rx="3"/>
  <rect id="slicker-yellow-v2-toggle-2" class="l2" fill="#6b4428" x="111" y="261" width="18" height="6" rx="3"/>
  <rect id="slicker-yellow-v2-toggle-3" class="l2" fill="#6b4428" x="111" y="283" width="18" height="6" rx="3"/>
</g>

<use href="#base-neck"/>

<!-- ===== LAYER COLLAR (in front of the neck, behind the head and chin). OUTFIT TASKS: collars, scarf, turtleneck. Drawstring of the hood hangs down the chest here. ===== -->
<g id="LAYER-collar">
  <path id="slicker-yellow-v2-drawcord-l" class="l2" fill="none" d="M96 212 C93 220 92 228 94 238"/>
  <path id="slicker-yellow-v2-drawcord-r" class="l2" fill="none" d="M146 216 C149 224 150 232 148 240"/>
  <rect id="slicker-yellow-v2-tip-l" class="l2" fill="#6b4428" x="91" y="236" width="6" height="10" rx="2.5"/>
  <rect id="slicker-yellow-v2-tip-r" class="l2" fill="#6b4428" x="145" y="240" width="6" height="10" rx="2.5"/>
</g>

<use href="#base-ears"/>
<use href="#base-head"/>
<use href="#base-face"/>

<!-- ===== LAYER HAIR. HAIR TASKS: replace this line/group. Baseline: short tapered curls (cloud of circles). ===== -->
<g id="LAYER-hair">
  <use href="#base-hs-shapes" class="hair l3"/><use href="#base-hs-shapes" class="hair" stroke="none"/>
</g>

<!-- Tattoo (delete this line if a garment covers the neck sprout), earrings, pencil (delete or move it if a hair covering would hide it) -->
<use href="#base-tat"/>
<use href="#base-acc"/>
<use href="#base-pencil"/>
</svg>
