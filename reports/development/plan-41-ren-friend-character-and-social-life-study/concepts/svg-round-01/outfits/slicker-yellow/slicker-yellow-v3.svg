<rect width="240" height="300" fill="#efe3cc"/>

<!-- ===== LAYER TORSO (behind the neck). OUTFIT TASKS: replace this group. slicker-yellow-v3: hood is up, so the hood-down shapes are removed. Slicker body, sleeves, raglan seams, placket and toggles kept from v2. Side collar pieces carry the outline from the hood hem down to the shoulders. ===== -->
<g id="LAYER-torso">
  <path id="slicker-yellow-v3-collar-l" class="l3" fill="#e3b83a" d="M56 116 C48 150 42 196 46 240 L100 220 L104 150 L78 124 Z"/>
