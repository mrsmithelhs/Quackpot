  <rect id="slicker-yellow-v3-toggle-3" class="l2" fill="#6b4428" x="111" y="283" width="18" height="6" rx="3"/>
</g>

<use href="#base-neck"/>

<!-- ===== LAYER COLLAR (in front of the neck, behind the head and chin). OUTFIT TASKS: collars, scarf, turtleneck. slicker-yellow-v3: gathered collar band at the neck base where the hood meets the jacket. ===== -->
