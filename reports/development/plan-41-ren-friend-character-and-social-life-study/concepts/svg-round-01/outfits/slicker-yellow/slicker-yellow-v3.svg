</g>

<use href="#base-ears"/>
<use href="#base-head"/>
<use href="#base-face"/>

<!-- ===== LAYER HAIR. HAIR TASKS: replace this line/group. slicker-yellow-v3: hood up over the head. Curls first (peeking under the top rim and at the temples), then the hood with its face opening, rolled-rim seam, lining band and drawstrings. ===== -->
<g id="LAYER-hair">
  <use href="#slicker-yellow-v3-curls" class="hair l3"/><use href="#slicker-yellow-v3-curls" class="hair" stroke="none"/>
  <path id="slicker-yellow-v3-hood" class="l3" fill="#e3b83a" fill-rule="evenodd" d="M120 24 C158 24 188 56 188 108 C188 112 188 116 185 119 Q178 123 170 123 C168 154 150 180 120 196 C90 180 72 154 70 123 Q62 123 55 119 C52 116 52 112 52 108 C52 56 82 24 120 24 Z M120 84 C147 84 162 102 162 126 C162 152 146 168 120 168 C94 168 78 152 78 126 C78 102 93 84 120 84 Z"/>
  <path id="slicker-yellow-v3-rim-seam" class="l2" fill="none" d="M68 122 C66 90 88 66 120 66 C152 66 174 90 172 122"/>
  <path id="slicker-yellow-v3-lining" class="l2" fill="#b8891f" fill-rule="evenodd" d="M120 80 C146 80 165 102 165 126 C165 156 147 172 120 172 C93 172 75 156 75 126 C75 102 94 80 120 80 Z M120 84 C147 84 162 102 162 126 C162 152 146 168 120 168 C94 168 78 152 78 126 C78 102 93 84 120 84 Z"/>
  <path id="slicker-yellow-v3-drawcord-l" class="l2" fill="none" d="M111 170 C109 180 106 190 106 202"/>
  <path id="slicker-yellow-v3-drawcord-r" class="l2" fill="none" d="M129 170 C131 180 134 190 134 202"/>
  <rect id="slicker-yellow-v3-tip-l" class="l2" fill="#6b4428" x="103" y="200" width="6" height="10" rx="2.5"/>
  <rect id="slicker-yellow-v3-tip-r" class="l2" fill="#6b4428" x="131" y="200" width="6" height="10" rx="2.5"/>
</g>

<!-- Earrings (drawn last so the hoop sits on top of the hood). Pencil removed in v3: the hood covers the ear. -->
<use href="#base-acc"/>
