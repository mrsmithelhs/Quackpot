  <path id="slicker-yellow-v3-sleeve-r" class="l3" fill="#e3b83a" d="M142 212 L192 232 C204 242 210 266 212 300 L172 300 L172 262 Q156 236 142 212 Z"/>
  <path id="slicker-yellow-v3-body" class="l3" fill="#e3b83a" d="M68 300 L68 262 Q84 236 98 212 Q120 222 142 212 Q156 236 172 262 L172 300 Z"/>
  <path id="slicker-yellow-v3-placket" class="l2" fill="none" d="M106 216 L106 300 M134 216 L134 300 M120 220 L120 300"/>
  <path id="slicker-yellow-v3-cords" class="l2" fill="none" d="M111 242 Q104 250 102 258 M129 242 Q136 250 138 258 M111 264 Q104 272 102 280 M129 264 Q136 272 138 280 M111 286 Q104 292 102 298 M129 286 Q136 292 138 298"/>
