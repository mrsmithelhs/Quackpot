    <path class="l3" fill="#6b7b4a" d="M100 256 Q80 261 60 256 C56 262 56 274 60 280 Q80 285 100 280 Z"/>
    <path class="l3" fill="#6b7b4a" d="M100 230 L94 217 L76 222 C66 228 61 242 60 258 Q80 264 100 258 Z"/>
