  </g>
  <rect x="104" y="244" width="7" height="11" rx="2" fill="#d9a441" class="l2"/>
</g>

<use href="#base-neck"/>

<!-- ===== LAYER COLLAR (in front of the neck, behind the head and chin). OUTFIT TASKS: collars, scarf, turtleneck. Empty by default. ===== -->
<g id="LAYER-collar">
  <path class="l3" fill="#6b7b4a" d="M93 202 Q97 196 107 198 L112 228 Q101 233 91 227 Z"/>
  <path class="l3" fill="#6b7b4a" d="M147 202 Q143 196 133 198 L128 228 Q139 233 149 227 Z"/>
</g>

<use href="#base-ears"/>
<use href="#base-head"/>
<use href="#base-face"/>

<!-- ===== LAYER HAIR. HAIR TASKS: replace this line/group. Baseline: short tapered curls (cloud of circles). ===== -->
<g id="LAYER-hair">
  <use href="#base-hs-shapes" class="hair l3"/><use href="#base-hs-shapes" class="hair" stroke="none"/>
</g>

<!-- Earrings and pencil (delete or move the pencil if a hat or hood would hide it). The sprout tattoo is not drawn here; use #base-tat only on a bare upper arm. -->
<use href="#base-acc"/>
<use href="#base-pencil"/>
</svg>
