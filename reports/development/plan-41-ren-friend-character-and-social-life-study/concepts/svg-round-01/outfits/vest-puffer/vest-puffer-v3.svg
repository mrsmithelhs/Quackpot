    <path fill="#8c9c66" d="M70 238 C68 244 67 249 67 253 Q72 255 77 255 C74 250 72 244 70 238Z"/>
    <path fill="#8c9c66" d="M66 264 C65 268 65 272 66 275 Q71 277 76 277 C72 273 70 268 70 264Z"/>
