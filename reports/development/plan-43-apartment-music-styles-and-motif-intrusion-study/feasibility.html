<!doctype html><meta charset="utf-8"><title>Plan 43 upstream feasibility</title>
<pre id="result">PENDING</pre>
<script>
(async () => {
 const output = document.querySelector('#result');
 const findings = { test: 'one-note external offline feasibility', sampleRate: 48000, seconds: 3 };
 const frame = document.createElement('iframe');
 document.body.append(frame);
 let original;
 try {
  const w = frame.contentWindow;
  let ticks=0; const nativeInterval=w.setInterval.bind(w); w.setInterval=(fn,ms)=>nativeInterval(()=>{ticks++; fn();},ms); findings.tickCount=()=>ticks;
  const script = w.document.createElement('script');
  script.src = new URL('vendor/webaudio-tinysynth.js', location.href).href;
  await new Promise((resolve,reject) => { script.onload=resolve; script.onerror=()=>reject(new Error('upstream load failed')); w.document.head.append(script); });
  const unhandled=[];
  w.addEventListener('unhandledrejection', e => { unhandled.push(String(e.reason)); e.preventDefault(); });
  const synth = new w.WebAudioTinySynth({quality:1,useReverb:0,voices:16});
  original=synth.getAudioContext();
  findings.constructorContext=original.constructor.name;
  await original.close();
  findings.originalClosed=original.state;
  const offline = new w.OfflineAudioContext(2, 3*48000, 48000);
  synth.setAudioContext(offline);
  synth.setTsMode(0);
  synth.setProgram(0,12);
  synth.noteOn(0,60,100,0.5);
  synth.noteOff(0,60,1.0);
  findings.noteTable=synth.notetab.map(n=>({note:n.n,start:n.t,end:n.e,released:n.f}));
  const buffer=await offline.startRendering();
  const data=buffer.getChannelData(0);
  function stats(a,b) {let peak=0,sum=0; for(let i=a*48000;i<b*48000;i++){let x=data[i]; peak=Math.max(peak,Math.abs(x)); sum+=x*x;} return {peak,rms:Math.sqrt(sum/((b-a)*48000))};}
  findings.pre=stats(0,0.4); findings.note=stats(0.5,1); findings.tail=stats(2,3);
  findings.offlineState=offline.state;
  await new Promise(r=>setTimeout(r,200));
  findings.unhandled=unhandled;
  findings.success=findings.pre.peak<1e-6 && findings.note.peak>1e-6 && findings.noteTable.some(n=>n.n===60 && n.t===0.5 && n.f===1) && unhandled.length===0;
 } catch (e) { findings.error=String(e && e.stack || e); findings.success=false; }
 finally { if(original && original.state!=='closed') await original.close().catch(()=>{}); frame.remove(); findings.frameRemoved=!frame.isConnected; const ticksAtRemoval=findings.tickCount ? findings.tickCount() : 0; await new Promise(r=>setTimeout(r,300)); findings.ticksAfterRemoval=(findings.tickCount ? findings.tickCount() : 0)-ticksAtRemoval; delete findings.tickCount; findings.success=Boolean(findings.success && findings.frameRemoved && findings.ticksAfterRemoval===0 && original.state==='closed'); output.textContent=JSON.stringify(findings,null,2); }
})();
</script>
