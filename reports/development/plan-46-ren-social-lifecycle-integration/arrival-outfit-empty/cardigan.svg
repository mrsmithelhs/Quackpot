  .ren-outfit-skin{fill:var(--skin)}.ren-outfit-shade{fill:var(--shade)}.ren-outfit-blush{fill:var(--blush)}.ren-outfit-hair{fill:var(--hair)}
  .ren-outfit-l3{stroke:#3a2c26;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
  .ren-outfit-l2{stroke:#3a2c26;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
</style>
