<svg class="ren-outfit-root" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Ren at the apartment door">
<title>Ren at the apartment door (v2)</title>
<desc>Looking from inside a warm apartment through the open front door. The wall and doorway fill the frame; no floor or table is shown. Ren, in striped tee and overalls, stands in the cooler hallway holding a small cardboard box with two light bulbs. The frame edge crops Ren at the chest.</desc>
