<!doctype html><meta charset="utf-8"><title>Synthetic storage inspection</title><h1>Synthetic storage inspection</h1><p>Read-only fingerprint of this isolated preview origin.</p><button id="inspect">Inspect current save</button><pre id="out" aria-live="polite"></pre><script>document.querySelector('#inspect').onclick=async()=>{try{let s=localStorage.getItem('quackpot_save_v1');if(s===null){document.querySelector('#out').textContent='No saved bytes';return}let b=new TextEncoder().encode(s),h=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',b))).map(x=>x.toString(16).padStart(2,'0')).join(''),v=JSON.parse(s);document.querySelector('#out').textContent='sha256 '+h+'\nbytes '+b.length+'\nphase '+v.state.phase+'\nstep '+v.state.step+'\nname '+v.state.physicalCompanion.name+'\nreceipt_shown '+v.eventLog.filter(x=>x.type==='receipt_shown').length}catch(e){document.querySelector('#out').textContent='Inspection unavailable: '+e.message}};</script>
